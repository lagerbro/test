name: novelpia-fetch
on:
  push:
    branches: [novelpia-fetch]
    paths: ['.novelpia/*.py', '.github/workflows/*']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .novelpia/probe.py | tee summary.txt
      - name: encrypt and commit
        run: |
          tar czf out.tgz out
          openssl rand -out k.bin 32
          openssl pkeyutl -encrypt -pubin -inkey .novelpia/pub.pem -in k.bin -out .novelpia/result.key.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k.bin -in out.tgz -out .novelpia/result.tgz.enc
          cp summary.txt .novelpia/summary.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add .novelpia/result.* .novelpia/summary.txt
          git commit -m "result" && git push
